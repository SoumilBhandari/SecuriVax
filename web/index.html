<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="description" content="Potency in every drop. Tap a box's tag to see if the vaccine inside is still good." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/sf-pro-text-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/sf-pro-display-semibold.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Link previews (messages, Slack, social). Crawlers need absolute URLs: update them with the domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SecuriVax" />
    <meta property="og:title" content="SecuriVax: is this vaccine still good?" />
    <meta property="og:description" content="Potency in every drop. Tap a box's tag and get one verdict (use, quarantine or discard) from everything the box has been through." />
    <meta property="og:url" content="https://securivax.onrender.com/" />
    <meta property="og:image" content="https://securivax.onrender.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The SecuriVax logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>SecuriVax</title>
    <script>
      // The theme before the first paint: the viewer's choice, else their system's.
      (function () {
        var pref = "system";
        try {
          pref = localStorage.getItem("securivax.theme") || "system";
        } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#000000" : "#f5f5f7");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
