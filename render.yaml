# Render blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: coldtrace
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free instances sleep after 15 idle minutes and take ~1 min to wake,
    # which would stall the first tag tap in front of judges.
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coldtrace-db
          property: connectionString
      - key: NODE_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: DEMO_HISTORY
        value: "true"

databases:
  - name: coldtrace-db
    plan: free
