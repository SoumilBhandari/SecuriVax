; SecuriVax node: ESP32 + a temperature sensor (SHT31, DS18B20 probe or DHT11/DHT22),
; optional NEO-6M GPS, on a LiPo.
;   pio run -e node -t upload     battery build: deep sleep, 1 reading/min
;   pio run -e demo -t upload     stage build: awake, 1 reading every 5 s

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 460800 (the default) corrupts on this board's CP2102 and the upload dies
; half way. 115200 takes about ninety seconds and works every time; raise it
; if you are flashing often and your cable is better than ours.
upload_speed = 115200
board_build.filesystem = littlefs
build_src_filter = +<*> -<scan.cpp> -<diag.cpp> -<i2cprobe.cpp>
lib_deps =
    adafruit/Adafruit SHT31 Library@^2.2.2
    mikalhart/TinyGPSPlus@^1.1.0
    bblanchon/ArduinoJson@^7.2.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
lib_ldf_mode = deep+

[env:node]
build_flags = -DDEMO_MODE=0

[env:demo]
build_flags = -DDEMO_MODE=1

; Finds the temperature sensor and its pins: pio run -e scan -t upload, then read the monitor.
[env:scan]
build_src_filter = +<scan.cpp>
lib_deps = ${env.lib_deps}

; Identifies the I2C sensor by reading it: pio run -e i2c -t upload, then read
; the monitor. An address scan only proves something acknowledged.
[env:i2c]
build_src_filter = +<i2cprobe.cpp>
lib_deps = ${env.lib_deps}

; One-pin DHT wiring check: pio run -e diag -t upload, then read the monitor.
[env:diag]
build_src_filter = +<diag.cpp>
